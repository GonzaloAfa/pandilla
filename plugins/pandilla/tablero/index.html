<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pandilla en vivo</title>
<style>
  :root {
    --bg: #ffffff; --ink: #1f2430; --muted: #6b7280; --line: #e5e7eb; --soft: #f6f7f9;
    --board: #1f3b2d; --chalk: #f3f6ee; --chalk-dim: #b9c7b4;
    --ok: #16a34a; --warn: #d97706; --bad: #dc2626; --info: #2563eb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 24px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 18px; margin: 0; }
  .live { color: var(--ok); font-size: 12px; }
  .live::before { content: "●"; margin-right: 4px; }
  header select { margin-left: auto; padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 40px; }

  .pizarron { background: var(--board); color: var(--chalk); border-radius: 14px; padding: 16px 20px; margin-bottom: 18px;
    border: 6px solid #6b4f32; box-shadow: inset 0 0 30px rgba(0,0,0,.25); }
  .pizarron h2 { margin: 0 0 4px; font: 600 20px/1.2 "Chalkboard SE", "Comic Sans MS", system-ui, sans-serif; }
  .pizarron .meta { color: var(--chalk-dim); font-size: 13px; }
  .pizarron .counts { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 10px; font-size: 13px; }
  .pizarron .counts b { font-size: 18px; display: block; }
  .pizarron ol { margin: 10px 0 0; padding-left: 20px; columns: 2; column-gap: 28px; font-size: 13px; }
  .pizarron li { break-inside: avoid; margin-bottom: 2px; }
  .pizarron li .st { color: var(--chalk-dim); }

  .rooms { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .room { border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; background: #fff; min-height: 200px; display: flex; flex-direction: column; gap: 8px; }
  .room.empty { background: var(--soft); border-style: dashed; color: var(--muted); align-items: center; justify-content: center; min-height: 140px; }
  .room-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .room-num { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .room-title { font-weight: 600; font-size: 15px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .branch { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .phase { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; padding: 4px 10px; border-radius: 999px; background: var(--soft); align-self: flex-start; }
  .steps { display: flex; gap: 4px; }
  .step { flex: 1; text-align: center; font-size: 10px; color: var(--muted); }
  .step i { display: block; height: 6px; border-radius: 3px; background: var(--line); margin-bottom: 3px; }
  .step.ok i { background: #86efac; }
  .step.cur i { background: var(--info); }
  .step.cur { color: var(--ink); font-weight: 600; }
  .now { font-size: 13px; color: var(--ink); background: var(--soft); border-radius: 8px; padding: 6px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now::before { content: "Ahora: "; color: var(--muted); }
  .crew { display: flex; flex-direction: column; gap: 3px; }
  .member { font-size: 12px; display: flex; gap: 6px; white-space: nowrap; overflow: hidden; }
  .member .who { font-weight: 600; flex: none; }
  .member .what { color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
  .member.off { opacity: .55; }
  .foot { margin-top: auto; display: flex; gap: 10px; font-size: 12px; color: var(--muted); align-items: center; flex-wrap: wrap; }
  .badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
  .b-ok { background: #dcfce7; color: #166534; } .b-bad { background: #fee2e2; color: #991b1b; }
  .b-warn { background: #fef3c7; color: #92400e; } .b-info { background: #dbeafe; color: #1e40af; }
  .sev { font-weight: 600; } .sev .c { color: var(--bad); } .sev .w { color: var(--warn); }

  .waiting { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)) auto; gap: 14px; margin-top: 14px; align-items: stretch; }
  .chair { border: 1px dashed var(--line); border-radius: 12px; padding: 10px 14px; background: var(--soft); font-size: 13px; display: flex; gap: 10px; align-items: center; }
  .chair .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chair.free { color: var(--muted); }
  .more { align-self: center; color: var(--muted); font-size: 12px; }

  .done { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; }
  .done .item { font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; }

  h3.sec { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 26px 0 8px; }
  .milestones { list-style: none; padding: 0; margin: 0; font-size: 13px; }
  .milestones li { padding: 5px 0; border-bottom: 1px solid var(--line); display: flex; gap: 10px; }
  .milestones time { color: var(--muted); flex: none; width: 84px; white-space: nowrap; }
  details.hall summary { cursor: pointer; color: var(--muted); font-size: 13px; margin-top: 22px; }
  .hall-row { font-size: 12px; padding: 4px 0; border-bottom: 1px solid var(--line); display: flex; gap: 8px; color: var(--muted); }
  .hall-row b { color: var(--ink); font-weight: 600; }
  .lote + .lote { margin-top: 30px; }
  @media (max-width: 760px) { .rooms, .waiting { grid-template-columns: 1fr; } .pizarron ol { columns: 1; } }
</style>
</head>
<body>
<header>
  <h1>🛹 Pandilla</h1><span class="live">en vivo</span>
  <select id="hours">
    <option value="1">Última hora</option>
    <option value="3" selected>Últimas 3 h</option>
    <option value="12">Últimas 12 h</option>
    <option value="48">2 días</option>
  </select>
</header>
<main id="app"></main>
<script>
const PHASE = {
  investigando: ["🔎", "Investigando"], desarrollando: ["🛠️", "Desarrollando"], verificando: ["✅", "Verificando"],
  panel: ["⚖️", "Panel de revisión"], probando: ["🧪", "Probando en local"], regresion: ["🛡️", "Regresión"],
  entregando: ["🚀", "Entregando"],
};
const SHORT = { investigando: "investiga", desarrollando: "desarrolla", verificando: "verifica", panel: "panel", probando: "prueba", regresion: "regresión", entregando: "entrega" };
const ROLES = {
  correctitud: ["🧠", "Correctitud"], sistemas: ["🔗", "Sistemas"], seguridad: ["🛡️", "Seguridad"], datos: ["🗄️", "Datos"],
  costos: ["💰", "Costos"], infra: ["🏗️", "Infra"], superficies: ["🎨", "Superficies"], producto: ["🎯", "Producto"],
  clinico: ["🩺", "Clínico"], arquitectura: ["🏛️", "Arquitectura"], pipeline: ["🧵", "Pipeline"], verificador: ["⚖️", "Verificador"],
  explore: ["🔎", "Explorador"], plan: ["🗺️", "Planificador"],
};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const ago = (now, t) => { const m = Math.max(0, Math.round((now - t) / 60)); return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${m % 60} min`; };
const clock = t => new Date(t * 1000).toLocaleTimeString("es-CL", { hour: "2-digit", minute: "2-digit" });

function who(agent) {
  const key = (agent.type || "").toLowerCase().replace(/^pandilla:/, "").replace(/^revisor-/, "");
  if (ROLES[key]) return ROLES[key];
  const d = (agent.description || "").toLowerCase();
  for (const [word, value] of Object.entries(ROLES)) if (d.includes(word.slice(0, 6))) return value;
  return ["🤖", agent.description || agent.type || "Agente"];
}

function sev(f) {
  if (!f || !(f.C || f.W || f.S)) return "";
  return `<span class="sev">${f.C ? `<span class="c">C${f.C}</span> ` : ""}${f.W ? `<span class="w">W${f.W}</span> ` : ""}${f.S ? `S${f.S}` : ""}</span>`;
}

function statusBadge(r) {
  if (r.status === "lista") return `<span class="badge b-ok">listo</span>`;
  if (r.status === "bloqueada") return `<span class="badge b-bad">bloqueado</span>`;
  if (r.verdict === "APROBADO") return `<span class="badge b-ok">panel aprobado</span>`;
  if (r.verdict) return `<span class="badge b-warn">cambios requeridos</span>`;
  if (r.status === "trabajando") return `<span class="badge b-info">trabajando</span>`;
  if (r.status === "esperando") return `<span class="badge b-warn">esperando</span>`;
  return `<span class="badge">${esc(r.status || "")}</span>`;
}

function room(r, n, phases, now) {
  if (!r) return `<div class="room empty">Habitación ${n} · libre</div>`;
  const cur = r.phase;
  const steps = phases.map(p => `<div class="step ${p === cur ? "cur" : (r.reached || []).includes(p) ? "ok" : ""}"><i></i>${SHORT[p]}</div>`).join("");
  const [icon, label] = PHASE[cur] || ["💤", r.status === "trabajando" ? "Arrancando" : "En pausa"];
  const crew = (r.agents || []).map(a => {
    const [e, name] = who(a);
    return `<div class="member ${a.status === "trabajando" ? "" : "off"}"><span class="who">${e} ${esc(name)}</span><span class="what">${esc(a.now || "")}</span></div>`;
  }).join("");
  return `<div class="room">
    <div class="room-head"><span class="room-num">Habitación ${n}${r.id ? " · " + esc(r.id) : ""}</span>${statusBadge(r)}</div>
    <div class="room-title" title="${esc(r.title)}">${esc(r.title || "sin título")}</div>
    <div class="branch">${esc(r.repo || "")}${r.branch ? " · ⎇ " + esc(r.branch) : ""}</div>
    <div class="phase">${icon} ${label}</div>
    <div class="steps">${steps}</div>
    ${r.now ? `<div class="now" title="${esc(r.now)}">${esc(r.now)}</div>` : ""}
    ${crew ? `<div class="crew">${crew}</div>` : ""}
    <div class="foot">${r.start ? `<span>⏱ ${ago(now, r.start)}</span>` : ""}${r.tokens ? `<span>${Math.round(r.tokens / 1000)}k tok</span>` : ""}${sev(r.findings)}${r.result ? `<span>${esc(r.result)}</span>` : ""}</div>
  </div>`;
}

function chairs(queue, waiting) {
  const shown = queue.slice(0, waiting);
  let html = "";
  for (let i = 0; i < waiting; i++) {
    const t = shown[i];
    html += t ? `<div class="chair">🪑 <span class="t"><b>${esc(t.id || "")}</b> ${esc(t.titulo || "")}</span></div>`
              : `<div class="chair free">🪑 libre</div>`;
  }
  html += `<div class="more">${queue.length > waiting ? `+${queue.length - waiting} más en cola` : ""}</div>`;
  return `<div class="waiting">${html}</div>`;
}

function render(d) {
  const app = document.getElementById("app");
  let html = "";
  if (d.lotes.length) {
    for (const l of d.lotes) {
      const all = [...l.rooms, ...l.extra, ...l.done];
      const total = all.length + l.queue.length;
      const f = { C: 0, W: 0, S: 0 };
      all.forEach(r => ["C", "W", "S"].forEach(k => f[k] += (r.findings || {})[k] || 0));
      const list = [...l.rooms.map(r => [r.id, r.title, PHASE[r.phase]?.[1]?.toLowerCase() || "trabajando"]),
                    ...l.queue.map(t => [t.id, t.titulo, "en espera"]),
                    ...l.done.map(r => [r.id, r.title, r.status === "lista" ? "listo" : "bloqueado"])];
      html += `<section class="lote"><div class="pizarron">
        <h2>${esc(l.titulo || "Lote")}</h2>
        <div class="meta">${esc(l.repo || "")}${l.inicio ? " · desde las " + clock(l.inicio) : ""} · ${total} pedidos</div>
        <div class="counts"><span><b>${l.rooms.length + l.extra.length}</b>trabajando</span><span><b>${l.queue.length}</b>en espera</span><span><b>${l.done.filter(r => r.status === "lista").length}</b>listos</span><span><b>${l.done.filter(r => r.status === "bloqueada").length}</b>bloqueados</span><span><b>${f.C}·${f.W}·${f.S}</b>hallazgos C·W·S</span></div>
        <ol>${list.map(([id, t, st]) => `<li>${id ? `<b>${esc(id)}</b> ` : ""}${esc(t || "")} <span class="st">— ${esc(st)}</span></li>`).join("")}</ol>
      </div>
      <div class="rooms">${Array.from({ length: d.rooms }, (_, i) => room(l.rooms[i], i + 1, d.phases, d.now)).join("")}</div>
      ${chairs(l.queue, d.waiting)}
      ${l.done.length ? `<div class="done">${l.done.map(r => `<span class="item">${r.status === "lista" ? "✅" : "⛔"} ${esc(r.id || "")} ${esc(r.result || r.title || "")}</span>`).join("")}</div>` : ""}
      </section>`;
    }
  } else {
    html += `<div class="pizarron"><h2>Sin lote en curso</h2>
      <div class="meta">Se muestran las sesiones que están trabajando ahora. Con <b>/pandilla:lote</b>, el pizarrón muestra el lote, sus pedidos y la cola.</div></div>
      <div class="rooms">${Array.from({ length: d.rooms }, (_, i) => room(d.free_rooms[i], i + 1, d.phases, d.now)).join("")}</div>
      ${chairs([], d.waiting)}`;
  }
  if (d.milestones.length) {
    html += `<h3 class="sec">Hitos</h3><ul class="milestones">${d.milestones.map(m => `<li><time>${clock(m.ts)}</time><span><b>${esc(m.title || "")}</b> · ${esc(m.text)}</span></li>`).join("")}</ul>`;
  }
  if (d.hallway.length) {
    html += `<details class="hall"><summary>Otras sesiones (${d.hallway.length})</summary>${d.hallway.map(h =>
      `<div class="hall-row"><b>${esc(h.repo || "")}</b><span>${esc(h.title || h.branch || "")}</span><span>· ${esc(h.status)}</span>${h.phase ? `<span>· ${esc(PHASE[h.phase]?.[1] || "")}</span>` : ""}</div>`).join("")}</details>`;
  }
  app.innerHTML = html;
}

const select = document.getElementById("hours");
try { const saved = localStorage.getItem("pandilla-h"); if (saved) select.value = saved; } catch (e) {}
select.onchange = () => { try { localStorage.setItem("pandilla-h", select.value); } catch (e) {} tick(); };
async function tick() {
  try {
    const r = await fetch(`/api/state?h=${select.value}`);
    render(await r.json());
  } catch (e) {}
}
tick();
setInterval(tick, 2000);
</script>
</body>
</html>
